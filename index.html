<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Карта новостроек Хабаровска</title>
<meta name="description" content="Все новостройки Хабаровска на одной карте: цены за м², сроки сдачи, отделка.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<style>
:root{
  --bg:#ffffff; --bg2:#f2f3f5; --text:#14161a; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2a7de1; --accentText:#fff; --shadow:0 6px 24px rgba(0,0,0,.14);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1f24; --bg2:#262a31; --text:#eef0f3; --muted:#9aa3ae; --line:#333842; --shadow:0 6px 24px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{--bg:#1c1f24; --bg2:#262a31; --text:#eef0f3; --muted:#9aa3ae; --line:#333842; --shadow:0 6px 24px rgba(0,0,0,.5);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg2)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);padding:0 12px;height:44px}
.search input{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;min-width:0}
.ibtn{position:relative;width:44px;height:44px;border-radius:14px;background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px}
.badge[hidden]{display:none!important}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:var(--accentText)}
.legend{position:fixed;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:400;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:11px;color:var(--muted);max-width:60vw}
.legend .scale{height:8px;border-radius:4px;margin:4px 0 2px;width:150px}
.legend .row{display:flex;justify-content:space-between;width:150px}
.legend .cat{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--text)}
.legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
.fab{position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:400;display:flex;flex-direction:column;gap:8px}
.count{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:400;background:var(--bg);box-shadow:var(--shadow);border-radius:20px;height:40px;padding:0 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.pin{display:flex;align-items:center;justify-content:center;border-radius:12px;color:#fff;font-weight:700;font-size:11px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);border:2px solid #fff;transform:translate(-50%,-50%);position:absolute;left:0;top:0}
.pin.dot{width:16px;height:16px;border-radius:50%;padding:0}
.pin.lbl{height:24px;padding:0 7px}
.pin.off{opacity:.55}
.pin.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:1000}
.pin .star{margin-left:3px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:800;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);max-height:78vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 8px}
.sh-head h2{margin:0;font-size:19px;line-height:1.2;flex:1}
.sh-head .sub{font-size:13px;color:var(--muted);margin-top:3px;font-weight:400}
.x{width:32px;height:32px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;flex:none}
.sh-body{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0 12px}
.kv div{background:var(--bg2);border-radius:12px;padding:8px 10px}
.kv b{display:block;font-size:15px}
.kv span{font-size:12px;color:var(--muted)}
.rooms{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.rooms div{background:var(--bg2);border-radius:10px;padding:6px 10px;font-size:13px}
.rooms div b{font-size:14px}
.offer{background:linear-gradient(90deg,#ff7a45,#ff4d6d);color:#fff;border-radius:12px;padding:9px 12px;font-weight:600;font-size:13px;margin:4px 0 12px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.cta{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{height:48px;border-radius:14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--accent);color:var(--accentText)}
.btn.s{background:var(--bg2)}
.priv{border:1.5px dashed #f5a524;border-radius:14px;padding:10px 12px;margin:10px 0;font-size:13px}
.priv h4{margin:0 0 6px;font-size:13px;color:#d48806}
.priv div{margin:3px 0}
.priv a{color:var(--accent)}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:36px;padding:0 14px;border-radius:18px;background:var(--bg2);font-weight:600;font-size:14px}
.opt.on{background:var(--accent);color:var(--accentText)}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangeval{font-weight:700;font-size:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .it .c{width:12px;height:12px;border-radius:50%;flex:none}
.list .it .n{flex:1;min-width:0}
.list .it .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .n span{font-size:12px;color:var(--muted)}
.list .it .pr{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.list .it .pr span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.empty{padding:20px 0;color:var(--muted);text-align:center}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top));z-index:600;background:#14161a;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);display:none;max-width:90vw;text-align:center}
.pw{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);padding:0 12px;font:inherit;margin:8px 0}
.err{color:#e5484d;font-size:13px;min-height:18px}
.foot{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.4}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.6)!important}
.leaflet-control-zoom{display:none}
.leaflet-tile-pane{filter:saturate(.75) contrast(.95)}
[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6)}
.target{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(0,0,0,.4);transform:translate(-50%,-50%);position:absolute}
.favb{width:32px;height:32px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;flex:none;font-size:17px;color:#e5484d}
.mort{background:var(--bg2);border-radius:16px;padding:12px;margin:14px 0 4px}
.mort h3{margin:0 0 8px;font-size:15px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accentText)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 2px;font-size:13px;color:var(--muted)}
.mrow b{color:var(--text);font-size:14px}
.mopts{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.mopts button{height:30px;padding:0 11px;border-radius:15px;background:var(--bg);font-size:13px;font-weight:600}
.mopts button.on{background:var(--accent);color:var(--accentText)}
.pay{font-size:24px;font-weight:800;margin:10px 0 2px}
.pay small{font-size:14px;font-weight:600;color:var(--muted)}
.mnote{font-size:12px;color:var(--muted);line-height:1.4;margin-top:6px}
.mwarn{font-size:12.5px;background:rgba(245,190,40,.18);border-radius:10px;padding:7px 9px;margin-top:8px;line-height:1.4}
details.who{margin-top:8px;font-size:13px}
details.who summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.who ul{margin:6px 0 0;padding-left:18px;color:var(--text)}
details.who li{margin:2px 0}
.near{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}
.near div{background:var(--bg2);border-radius:12px;padding:7px 8px;font-size:12px;color:var(--muted);line-height:1.25}
.near b{display:block;color:var(--text);font-size:14px}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-weight:600;color:var(--muted);width:30%}
.cmpw{overflow-x:auto}
.load{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:var(--bg);font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<div id="map"></div>
<div class="load" id="load">Загружаю новостройки…</div>

<div class="top">
  <div class="bar">
    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ЖК, застройщик, район" autocomplete="off">
    </label>
    <button class="ibtn" id="bFilters" aria-label="Фильтры">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span class="badge" id="fBadge" hidden>0</span>
    </button>
    <button class="ibtn" id="bMenu" aria-label="Ещё">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>
  <div class="chips" id="modes"></div>
</div>

<div class="hint" id="hint"></div>
<div class="legend" id="legend"></div>
<button class="count" id="bList"><span id="cnt">0</span>&nbsp;ЖК · списком</button>
<div class="fab">
  <button class="ibtn" id="bNear" aria-label="Хочу жить здесь">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
  </button>
  <button class="ibtn" id="bLoc" aria-label="Весь город">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-head"><h2 id="shTitle"></h2><span id="shExtra"></span><button class="x" id="shClose" aria-label="Закрыть">✕</button></div>
  <div class="sh-body" id="shBody"></div>
</div>

<script>
"use strict";
const BOT = "emil_khv_bot";
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
const inTG = !!(TG && TG.initData);
if (TG) { try { TG.ready(); TG.expand(); } catch(e){} }
const dark = TG ? TG.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.dataset.theme = dark ? "dark" : "light";
if (TG && TG.themeParams && TG.themeParams.button_color) {
  document.documentElement.style.setProperty("--accent", TG.themeParams.button_color);
  if (TG.themeParams.button_text_color) document.documentElement.style.setProperty("--accentText", TG.themeParams.button_text_color);
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtM = v => v == null ? "-" : (v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.?0+$/,"").replace(".", ",");
const TODAY = new Date().toISOString().slice(0,10);

let DATA = [], META = {}, PRIV = null;
const S = { // состояние
  mode: "ppm", heat: true, q: "",
  budget: 30, rooms: new Set(), districts: new Set(), deadline: new Set(), finish: new Set(),
  onlySale: true, offers: false, near: null, radius: 2, sel: null
};

/* ---------- цвета ---------- */
function lerp(a,b,t){return a+(b-a)*t}
function grad(t){ // зелёный -> жёлтый -> красный
  t = Math.max(0, Math.min(1, t));
  const stops = [[0,[38,176,104]],[0.5,[245,190,40]],[1,[229,57,53]]];
  let i = t <= .5 ? 0 : 1; const [t0,c0] = stops[i], [t1,c1] = stops[i+1];
  const k = (t - t0) / (t1 - t0);
  return `rgb(${c0.map((c,j)=>Math.round(lerp(c,c1[j],k))).join(",")})`;
}
let PPM_LO = 120, PPM_HI = 300;
function feeNum(p){ if(!p||!p.fee) return null; const m = String(p.fee).replace(",",".").match(/(\d+(\.\d+)?)\s*%/); return m ? +m[1] : null; }
const MODES = {
  ppm: { label: "Цена м²", color: z => z.ppm ? grad((z.ppm-PPM_LO)/(PPM_HI-PPM_LO)) : "#9aa3ae",
         text: z => z.ppm ? z.ppm + " т" : "" },
  year: { label: "Сдача", cats: [["Сдан", "#2a7de1"],["2026","#26b068"],["2027","#f5be28"],["2028+","#e5484d"]],
          cat: z => (z.status === "сдан") ? 0 : (!z.year || z.year <= 2026) ? 1 : z.year === 2027 ? 2 : 3,
          color: z => MODES.year.cats[MODES.year.cat(z)][1], text: z => z.status === "сдан" ? "сдан" : (z.year ? (z.q ? z.q + "кв " : "") + String(z.year).slice(2) : "") },
  finish: { label: "Отделка", cats: [["С ремонтом","#26b068"],["Предчистовая","#f5be28"],["Черновая","#8b95a1"],["Уточнить","#c9ced6"]],
          cat: z => z.finish.includes("ремонт")||z.finish.includes("чистовая") ? 0 : z.finish.includes("предчистовая") ? 1 : z.finish.includes("черновая") ? 2 : 3,
          color: z => MODES.finish.cats[MODES.finish.cat(z)][1], text: z => ["ремонт","предчист.","черновая",""][MODES.finish.cat(z)] },
  fee: { label: "Комиссия", priv: true, color: z => { const f = feeNum(PRIV && PRIV[z.id]); return f == null ? "#c9ced6" : grad(1 - Math.min(f,3)/3); },
         text: z => { const p = PRIV && PRIV[z.id]; const f = feeNum(p); return f != null ? String(f).replace(".",",") + "%" : (p && p.fee ? "?" : ""); } }
};

/* ---------- карта ---------- */
const map = L.map("map", { zoomControl:false, attributionControl:true, minZoom:10, maxZoom:18 }).setView([48.48,135.08], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
let heat = null, markers = L.layerGroup().addTo(map), nearLayer = L.layerGroup().addTo(map);

/* ---------- фильтры ---------- */
function roomKey(k){ return k === "st" ? "st" : (+k >= 4 ? "4" : k); }
function passes(z){
  if (S.onlySale && !(z.flats > 0 && z.pmin)) return false;
  if (S.offers && !(z.offer && z.offerUntil >= TODAY)) return false;
  if (S.q) { const h = (z.name+" "+(z.brand||"")+" "+z.district+" "+(z.mkr||"")+" "+(z.addr||"")).toLowerCase(); if (!h.includes(S.q)) return false; }
  if (S.districts.size && !S.districts.has(z.district)) return false;
  if (S.deadline.size) { const c = MODES.year.cat(z); if (!S.deadline.has(c)) return false; }
  if (S.finish.size) { const c = MODES.finish.cat(z); if (!S.finish.has(c)) return false; }
  if (S.budget < 30 || S.rooms.size) {
    if (S.rooms.size) {
      const ok = Object.entries(z.rooms||{}).some(([k,v]) => S.rooms.has(roomKey(k)) && (S.budget >= 30 || v <= S.budget));
      if (!ok) return false;
    } else if (!(z.pmin && z.pmin <= S.budget)) return false;
  }
  if (S.near) { if (dist(S.near, z) > S.radius) return false; }
  return true;
}
function activeFilters(){
  return (S.budget<30) + (S.rooms.size>0) + (S.districts.size>0) + (S.deadline.size>0) + (S.finish.size>0) + (!S.onlySale) + S.offers;
}
function dist(a, z){ const R=6371, toR=x=>x*Math.PI/180, dLa=toR(z.lat-a.lat), dLo=toR(z.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(z.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

/* ---------- отрисовка ---------- */
let visible = [];
function render(){
  visible = DATA.filter(passes);
  const md = MODES[S.mode], zoom = map.getZoom(), big = zoom >= 13;
  markers.clearLayers();
  for (const z of visible) {
    const c = md.color(z), t = big ? md.text(z) : "";
    const star = z.offer && z.offerUntil >= TODAY ? '<span class="star">★</span>' : "";
    const html = `<div class="pin ${t?"lbl":"dot"} ${z.flats>0?"":"off"} ${S.sel===z.id?"sel":""}" style="background:${c}">${t?esc(t)+star:""}</div>`;
    const m = L.marker([z.lat,z.lng], { icon: L.divIcon({ className:"", html, iconSize:[0,0] }), zIndexOffset: S.sel===z.id?1000:(z.flats>0?100:0) });
    m.on("click", () => openCard(z.id));
    markers.addLayer(m);
  }
  if (heat) { map.removeLayer(heat); heat = null; }
  if (S.heat && S.mode === "ppm") {
    const pts = visible.filter(z=>z.ppm).map(z => [z.lat, z.lng, Math.max(.15, Math.min(1, (z.ppm-PPM_LO)/(PPM_HI-PPM_LO)))]);
    if (pts.length) heat = L.heatLayer(pts, { radius: big ? 45 : 35, blur: 30, maxZoom: 14, max: 1, minOpacity: .25,
      gradient: {0.2:"#26b068", 0.5:"#f5be28", 0.8:"#ff7a45", 1:"#e53935"} }).addTo(map);
  }
  $("#cnt").textContent = visible.length;
  const n = activeFilters(); $("#fBadge").hidden = !n; $("#fBadge").textContent = n;
  renderModes(); renderLegend();
}
function renderModes(){
  const keys = Object.keys(MODES).filter(k => !MODES[k].priv || PRIV);
  $("#modes").innerHTML = keys.map(k => `<button class="chip ${S.mode===k?"on":""}" data-m="${k}">${MODES[k].label}</button>`).join("")
    + (S.mode==="ppm" ? `<button class="chip ${S.heat?"on":""}" data-heat="1">Тепловой слой</button>` : "")

/* ---------- что рядом ---------- */
function nearHtml(z){
  const n = z.near; if (!n) return "";
  const m = v => v < 1000 ? Math.round(v/10)*10 + " м" : (v/1000).toFixed(1).replace(".",",") + " км";
  const pl = (n, f) => f[(n%10===1 && n%100!==11) ? 0 : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 1 : 2];
  const cell = (k, f) => { if (!n[k]) return ""; const c = n[k][1] || 0, d = n[k][2];
    return `<div><b>${c}</b>${pl(c, f)}<br>${d == null ? "нет ближе 3 км" : "ближайш. " + m(d)}</div>`; };
  return `<div class="sec" style="margin-top:12px">Рядом, в радиусе 1 км</div><div class="near">
    ${cell("school",["школа","школы","школ"])}${cell("kg",["детсад","детсада","детсадов"])}${cell("shop",["магазин","магазина","магазинов"])}${cell("stop",["остановка","остановки","остановок"])}${cell("med",["поликл./аптека","поликл./аптеки","поликл./аптек"])}${cell("park",["парк, площадка","парка, площадки","парков, площадок"])}</div>
    <div class="mnote">По OpenStreetMap, расстояние по прямой. Закреплённую школу и сад уточнит Эмиль.</div>`;
}

/* ---------- ипотека ---------- */
const MORT = {
  updated: "12.11.2026", pvMin: 20,
  dv:  { rate: 2, years: 20, lim: 6, limBig: 9 },
  fam: { years: 30, pref: 15, kids: { 1:[10,6], 2:[8,8], 3:[6,10], 4:[4,10], 5:[2,10] } },
  mkt: { rate: 20, min: 15, max: 24, years: 30 }
};
const MS = { prog: "dv", room: null, pv: 20, kids: 1, mrate: MORT.mkt.rate };
function annuity(loan, ratePct, years){ const n = years*12, r = ratePct/1200; return r ? loan*r/(1-Math.pow(1+r,-n)) : loan/n; }
const rub = v => Math.round(v).toLocaleString("ru-RU").replace(/,/g," ") + " ₽";
const mln = v => fmtM(v/1e6) + " млн";
function mortInit(z){
  const keys = Object.keys(z.rooms||{}); if (!MS.room || !keys.includes(MS.room)) MS.room = keys.includes("2") ? "2" : keys.includes("1") ? "1" : keys[0];
  mortRender(z);
}
function mortRender(z){
  const ROOMN = {st:"Студия","1":"1к","2":"2к","3":"3к","4":"4к","5":"5к"};
  const price = (z.rooms[MS.room] || z.pmin) * 1e6;
  let rate, years, limit, warn = "", extra = "";
  const bigRoom = !(MS.room === "st" || MS.room === "1");
  if (MS.prog === "dv") {
    rate = MORT.dv.rate; years = MORT.dv.years; limit = MORT.dv.lim;
    if (bigRoom && z.amax >= 60) warn = `Если квартира от 60 м², лимит может быть до ${MORT.dv.limBig} млн. Но в зоне 60-65 м² всё решает площадь балкона: проходит под 6 или под 9 млн - уточни у Эмиля, проверит конкретную квартиру.`;
    extra = `<details class="who"><summary>Подхожу ли я под ДВ-ипотеку?</summary><ul>
      <li>Молодая семья, оба супруга до 36 лет</li><li>Одинокий родитель до 36 лет с ребёнком</li>
      <li>Многодетные, если 3-й или следующий ребёнок родился с 2024 года</li>
      <li>Медики, педагоги, работники ОПК и соцзащиты (госучреждения)</li>
      <li>Участники СВО и их семьи</li><li>Участники «Дальневосточного гектара», переселенцы по программам мобильности</li></ul>
      <div class="mnote">Ставка 2% (около 3% без страхования жизни), срок до 20 лет, взнос от 20%, прописаться в квартире и прожить 5 лет. Только у застройщика, переуступка не подходит.</div></details>`;
  } else if (MS.prog === "fam") {
    const k = MORT.fam.kids[MS.kids]; rate = k[0]; limit = k[1]; years = MORT.fam.years;
    extra = `<div class="mrow">Детей в семье</div><div class="mopts">${[1,2,3,4,5].map(n=>`<button data-kids="${n}" class="${MS.kids===n?"on":""}">${n===5?"5+":n}</button>`).join("")}</div>
      <div class="mnote">Ставка ${rate}%, лимит ${limit} млн. Нужен ребёнок до 7 лет. Льготная ставка первые ${MORT.fam.pref} лет, дальше рыночная. Супруги оформляют вместе.</div>`;
  } else {
    rate = MS.mrate; years = MORT.mkt.years; limit = Infinity;
    extra = `<div class="mrow">Ставка банка <b>${String(rate).replace(".",",")}%</b></div>
      <input type="range" id="mRate" min="${MORT.mkt.min}" max="${MORT.mkt.max}" step="0.5" value="${rate}">
      <div class="mnote">Ставки банков разные, примерно ${MORT.mkt.min}-${MORT.mkt.max}%. Здесь средняя - подвигай под свой банк.</div>`;
  }
  let pvSum = price * MS.pv / 100, loan = price - pvSum;
  if (loan > limit*1e6) { loan = limit*1e6; pvSum = price - loan; warn = `Кредит упирается в лимит программы ${limit} млн, остальное - взносом: ${mln(pvSum)}. ` + warn; }
  const pay = annuity(loan, rate, years);
  $("#mort").innerHTML = `<h3>Сколько платить в месяц</h3>
    <div class="seg">${[["dv","ДВ 2%"],["fam","Семейная"],["mkt","Обычная"]].map(([k,l])=>`<button data-prog="${k}" class="${MS.prog===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="mrow">Квартира</div><div class="mopts">${Object.keys(z.rooms).map(k=>`<button data-room="${k}" class="${MS.room===k?"on":""}">${ROOMN[k]||k} от ${fmtM(z.rooms[k])}</button>`).join("")}</div>
    <div class="mrow">Первый взнос <b>${MS.pv}% · ${mln(price*MS.pv/100)}</b></div>
    <input type="range" id="mPv" min="${MORT.pvMin}" max="90" step="5" value="${MS.pv}">
    ${extra}
    <div class="pay">≈ ${rub(pay)} <small>/ мес</small></div>
    <div class="mnote">Кредит ${mln(loan)} на ${years} лет под ${String(rate).replace(".",",")}% · цена от ${mln(price)}</div>
    ${warn ? `<div class="mwarn">${warn}</div>` : ""}
    <div class="mnote">Расчёт примерный: итог зависит от банка, страховки, точной цены и площади квартиры. Условия программ на ${MORT.updated}.</div>
    <div class="cta"><button class="btn p" id="mAsk">Точный расчёт у Эмиля</button></div>`;
  const box = $("#mort");
  box.querySelectorAll("[data-prog]").forEach(b => b.onclick = () => { MS.prog = b.dataset.prog; mortRender(z); });
  box.querySelectorAll("[data-room]").forEach(b => b.onclick = () => { MS.room = b.dataset.room; mortRender(z); });
  box.querySelectorAll("[data-kids]").forEach(b => b.onclick = () => { MS.kids = +b.dataset.kids; mortRender(z); });
  $("#mPv").oninput = e => { MS.pv = +e.target.value; mortRender(z); };
  if ($("#mRate")) $("#mRate").oninput = e => { MS.mrate = +e.target.value; mortRender(z); };
  $("#mAsk").onclick = () => ask(z, "i");
}

  if (b.dataset.heat) S.heat = !S.heat;
  if (b.dataset.offers) S.offers = !S.offers;
  if (b.dataset.fav) { openFav(); return; }
  render();
});
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); render();
  if (S.q && visible.length === 1) { const z = visible[0]; map.setView([z.lat,z.lng], 15); openCard(z.id); } }, 200); });
map.on("zoomend", render);
map.on("click", () => { if (picking) return; if (sheetKind) closeSheet(); });

/* ---------- «Хочу жить здесь» ---------- */
let picking = false;
function hint(t, ms){ const h=$("#hint"); h.textContent=t; h.style.display=t?"block":"none"; if (ms) setTimeout(()=>{ if(h.textContent===t) h.style.display="none"; }, ms); }
function setNear(pt, list){
  S.near = pt; nearLayer.clearLayers();
  if (pt) {
    L.circle([pt.lat,pt.lng], { radius:S.radius*1000, color:"#2a7de1", weight:2, fillOpacity:.07 }).addTo(nearLayer);
    L.marker([pt.lat,pt.lng], { icon:L.divIcon({className:"",html:'<div class="target"></div>',iconSize:[0,0]}), interactive:false }).addTo(nearLayer);
    map.fitBounds(L.latLng(pt.lat,pt.lng).toBounds(S.radius*2200), { animate:true });
  }
  render(); if (list) openList();
}
$("#bNear").onclick = () => {
  if (S.near) { setNear(null); closeSheet(); return; }
  closeSheet(); picking = true; hint("Коснись карты там, где клиент хочет жить");
};
map.on("click", e => { if (!picking) return; picking = false; hint(""); setNear({lat:e.latlng.lat, lng:e.latlng.lng}, true); });
$("#bLoc").onclick = () => fitAll();
function fitAll(){ const b = L.latLngBounds(visible.length ? visible.map(z=>[z.lat,z.lng]) : DATA.map(z=>[z.lat,z.lng])); map.fitBounds(b, { padding:[30,30] }); }

/* ---------- меню и вход для Эмиля ---------- */
const store = {
  get: k => new Promise(res => { if (TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9")) TG.CloudStorage.getItem(k, (e,v)=>res(v||null)); else { try { res(localStorage.getItem(k)); } catch(e){ res(null); } } }),
  set: (k,v) => { if (TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9")) TG.CloudStorage.setItem(k, v||""); else { try { v ? localStorage.setItem(k,v) : localStorage.removeItem(k); } catch(e){} } }
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = await fetch("data/private.json?" + Date.now()).then(r=>r.json());
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(enc.salt), iterations:enc.iter, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
$("#bMenu").onclick = () => {
  const body = `
    <div class="cta" style="margin-top:0">
      <button class="btn p" id="mEmil">Написать Эмилю</button>
      <button class="btn s" id="mAll">Показать весь город</button>
    </div>
    <div class="foot">Все новостройки Хабаровска на одной карте. Цены и наличие на ${esc(META.updated)}, обновляются раз в 2-4 недели. Цена за м² - оценка по диапазону цен и площадей ЖК, точные цены и свободные квартиры - у Эмиля.</div>
    <div class="sec" style="margin-top:22px">🔒 Для Эмиля</div>
    ${PRIV ? `<div class="note">Вход выполнен: видны комиссии, контакты, режим «Комиссия».</div><button class="btn s" id="mOut" style="width:100%">Выйти</button>`
           : `<input class="pw" id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><div class="err" id="pwErr"></div><button class="btn s" id="mIn" style="width:100%">Войти</button>`}`;
  openSheet("Карта новостроек Хабаровска", body, "menu");
  $("#mEmil").onclick = () => { const u = `https://t.me/${BOT}?start=menu`; TG ? TG.openTelegramLink(u) : window.open(u,"_blank"); };
  $("#mAll").onclick = () => { closeSheet(); fitAll(); };
  if ($("#mIn")) $("#mIn").onclick = async () => {
    $("#pwErr").textContent = "Проверяю…";
    try { PRIV = await decrypt($("#pw").value.trim()); store.set("mp", $("#pw").value.trim()); $("#pwErr").textContent = ""; render(); $("#bMenu").click(); }
    catch(e) { $("#pwErr").textContent = "Неверный пароль"; }
  };
  if ($("#mOut")) $("#mOut").onclick = () => { PRIV = null; store.set("mp", ""); if (S.mode==="fee") S.mode="ppm"; render(); $("#bMenu").click(); };
};

/* ---------- старт ---------- */
(async function init(){
  try {
    const d = await fetch("data/zk.json?" + Date.now()).then(r=>r.json());
    DATA = d.items; META = d.meta;
    try { const nb = await fetch("data/nearby.json?" + Date.now()).then(r => r.ok ? r.json() : null); if (nb && nb.near) DATA.forEach(z => { if (nb.near[z.id]) z.near = nb.near[z.id]; }); } catch(e){}
    const ps = DATA.map(z=>z.ppm).filter(Boolean).sort((a,b)=>a-b);
    if (ps.length > 5) { PPM_LO = Math.round(ps[Math.floor(ps.length*.05)]/10)*10; PPM_HI = Math.round(ps[Math.floor(ps.length*.92)]/10)*10; }
    render(); fitAll();
    $("#load").remove();
    const fv = await store.get("fav"); if (fv) { FAV = fv.split(",").map(Number).filter(id => DATA.some(z=>z.id===id)); renderModes(); }
    const pw = await store.get("mp");
    if (pw) { try { PRIV = await decrypt(pw); render(); } catch(e){ store.set("mp",""); } }
    // ссылка вида ?zk=12 открывает карточку
    const sp = new URLSearchParams(location.search), zk = sp.get("zk") || (TG && TG.initDataUnsafe && (TG.initDataUnsafe.start_param||"").replace(/^zk/,""));
    if (zk && DATA.find(z=>z.id==zk)) { const z = DATA.find(x=>x.id==zk); map.setView([z.lat,z.lng],15); openCard(z.id); }
  } catch(e) { $("#load").textContent = "Не получилось загрузить карту. Проверь интернет и открой ещё раз."; }
})();
</script>
